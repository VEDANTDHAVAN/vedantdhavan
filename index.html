    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Load the typeface non-blocking. The CSS @import in src/index.css is render-blocking
      and was delaying the first paint. This preload + print-media trick lets the browser
      paint with system fonts immediately and swap in Mona Sans once it arrives.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap" /></noscript>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <!--
      Remove the @import of the font from src/index.css so the stylesheet itself is not
      render-blocking. The font is now loaded above with a non-blocking swap.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
